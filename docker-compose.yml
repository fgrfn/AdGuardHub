services:
  adguardhub:
    image: ghcr.io/fgrfn/adguardhub:latest
    # Present so `docker compose up -d --build` builds from this checkout. Without it
    # that command silently reuses whatever image is already cached locally, which is
    # the one thing you do not want when you are trying to test a change.
    # To run the published image instead, use `docker compose pull` (not --build).
    build: .
    container_name: adguardhub
    restart: unless-stopped
    ports:
      # The container listens on 80. Map it elsewhere (e.g. "8080:80") if the host
      # already serves something on port 80.
      - "80:80"
    volumes:
      - ./data:/data
    environment:
      # Optional. Signs session cookies AND derives the key that encrypts the
      # stored AdGuard credentials. Left unset — as it is here — the hub creates
      # one on first start and keeps it in /data/secret.key, so nothing has to be
      # configured and the credentials survive updates.
      #
      # Setting it is still the better option, because then the key lives outside
      # the directory it protects. Generate one with `openssl rand -base64 48`
      # and put it in a .env file next to this one:
      # ADGUARDHUB_SECRET_KEY: "${ADGUARDHUB_SECRET_KEY:?set it in .env or delete this line}"
      #
      # Never paste an example value here. A key that is published is worse than
      # no key at all: the hub would start, look healthy, and protect nothing.

      # The user that should own /data. Set these to the host user that owns the
      # mounted directory — on Unraid that is PUID=99, PGID=100.
      PUID: "1000"
      PGID: "1000"

      # Optional: create the admin account on first start. Without these, the UI
      # asks you to create it on the first visit instead.
      # ADGUARDHUB_ADMIN_USERNAME: "admin"
      # ADGUARDHUB_ADMIN_PASSWORD: "choose-a-strong-password"

      # Optional tuning (seconds).
      # ADGUARDHUB_RECONCILE_INTERVAL: "900"
      # ADGUARDHUB_RETRY_INTERVAL: "30"
      # ADGUARDHUB_QUERYLOG_POLL_INTERVAL: "5"

      # Optional: DEBUG adds the per-instance diagnostics (and a lot of HTTP
      # client chatter) while you are chasing a misbehaving node.
      # ADGUARDHUB_LOG_LEVEL: "DEBUG"

      # Optional: also keep a rotating log file inside the data volume. Docker
      # already captures stderr, so this is only worth setting if you want a copy
      # that survives `docker rm`.
      # ADGUARDHUB_LOG_FILE: "/data/adguardhub.log"

    # Without this, Docker's json-file driver keeps every line the container has
    # ever written, forever. A hub that runs for months fills a disk quietly.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
